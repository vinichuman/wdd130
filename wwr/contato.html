<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Entre em contato com a WWR Rafting. Tire suas dúvidas, faça reservas ou envie sugestões.">
    <meta name="author" content="Vinicius Chuman">
    <title>Fale Conosco | WWR Rafting</title>
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <img src="imagens/logo.jpeg" alt="Logo WWR Rafting">
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="imagens/rafting_p.jpg" alt="Rafting em Corredeiras">
            <h1>Fale Conosco</h1>
        </div>

        <div class="contato-grid">

            <!-- Informações da empresa -->
            <section class="info-empresa">
                <h2>Informações de Contato</h2>
                <p>📍 Rua das Corredeiras, 123 - São Paulo, SP</p>
                <p>📞 (11) 99999-9999</p>
                <p>✉️ contato@wwrrafting.com.br</p>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.0!2d-46.6!3d-23.5!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjPCsDMwJzAwLjAiUyA0NsKwMzYnMDAuMCJX!5e0!3m2!1spt-BR!2sbr!4v1"
                    width="400" height="200" allowfullscreen="" loading="lazy">
                </iframe>

                <!-- Funcionários -->
                <h2>Nossa Equipe</h2>
                <div class="equipe">
                    <figure>
                        <img src="imagens/aventura1.jpg" alt="Foto de Ana Silva">
                        <figcaption>Ana Silva - Guia Chefe</figcaption>
                    </figure>
                    <figure>
                        <img src="imagens/aventura2.jpg" alt="Foto de Carlos Souza">
                        <figcaption>Carlos Souza - Instrutor</figcaption>
                    </figure>
                    <figure>
                        <img src="imagens/aventura3.jpg" alt="Foto de Maria Lima">
                        <figcaption>Maria Lima - Coordenadora</figcaption>
                    </figure>
                </div>
            </section>

            <!-- Formulário -->
            <section class="formulario">
                <h2>Envie sua Mensagem</h2>
                <form action="#" method="get">

                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>

                    <fieldset>
                        <legend>Finalidade da Mensagem:</legend>
                        <label for="geral">
                            <input type="radio" id="geral" name="finalidade" value="geral" required> Consulta Geral
                        </label>
                        <label for="reserva">
                            <input type="radio" id="reserva" name="finalidade" value="reserva"> Pergunta sobre Reserva
                        </label>
                        <label for="sugestao">
                            <input type="radio" id="sugestao" name="finalidade" value="sugestao"> Sugestão de Site
                        </label>
                    </fieldset>

                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter"> Quero receber a newsletter mensal
                    </label>

                    <button type="submit">Enviar Mensagem</button>

                </form>
            </section>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 WWR Rafting | Vinicius Chuman</p>
        <nav class="redes-sociais">
            <a href="https://facebook.com">
                <img src="imagens/facebook.svg" alt="Ícone do Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="imagens/linkedin.svg" alt="Ícone do LinkedIn">
            </a>
            <a href="https://instagram.com">
                <img src="imagens/instagram.svg" alt="Ícone do Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
